<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฝึกพูด — SpeakUp</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .session { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px; }
  .focusbar-inner .segments { flex: 1; }
  .counter { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .stage { flex: 1; padding: 8px 0 24px; }
  .stage-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .sentence-img { width: 100%; border-radius: var(--r-xl); transition: max-width .25s ease; margin: 0 auto; }
  .sentence-en { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 6vw, 34px); line-height: 1.3; letter-spacing: -0.01em; margin-top: 24px; }
  .sentence-th { font-size: 18px; color: var(--muted); margin-top: 8px; }
  .listen { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .listen .sentence-img { max-width: 320px; }
  .speaker { position: relative; width: 112px; height: 112px; border-radius: 36px; border: 0; margin-top: 32px; cursor: pointer; display: grid; place-items: center;
    background: var(--accent-strong); color: var(--on-accent); box-shadow: 0 6px 0 var(--accent-shade); transition: transform .08s, box-shadow .08s, background-color .15s; }
  .speaker:hover { background: var(--accent-hover); }
  .speaker:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-shade); }
  .speaker .icon { width: 48px; height: 48px; stroke-width: 2; }
  .speaker::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 3px solid var(--accent-strong); opacity: 0; pointer-events: none; }
  .speaker.playing::after { animation: pulse-ring 1s ease-out infinite; }
  .listen-hint { margin-top: 20px; font-size: 15px; color: var(--muted); min-height: 24px; }
  .quiz-q { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.45; margin-bottom: 20px; }
  .quiz-ref { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: var(--r-lg); background: var(--surface-2); margin-bottom: 20px; }
  .quiz-ref .ph-img { width: 84px; aspect-ratio: 1; padding: 6px; border-radius: 12px; flex: none; }
  .quiz-ref .ph-img span { display: none; }
  .options { display: grid; gap: 12px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 12px 16px; text-align: left; cursor: pointer;
    border-radius: var(--r-lg); border: 2px solid var(--border); background: var(--surface); box-shadow: 0 4px 0 var(--border); font-size: 17px; line-height: 1.45;
    transition: transform .08s, box-shadow .08s, background-color .15s, border-color .15s; }
  .opt:hover:not(:disabled) { background: var(--surface-2); }
  .opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
  .opt .key { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--border); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 14px; flex: none; }
  .opt[aria-checked="true"] { border-color: var(--fg); box-shadow: 0 4px 0 var(--fg); }
  .opt[aria-checked="true"] .key { background: var(--fg); border-color: var(--fg); color: var(--surface); }
  .opt.is-correct { border-color: var(--success); background: var(--success-soft); box-shadow: 0 4px 0 var(--success); color: var(--fg); }
  .opt.is-correct .key { background: var(--success); border-color: var(--success); color: var(--on-accent); }
  .opt.is-wrong { border-color: var(--danger); background: var(--danger-soft); box-shadow: 0 4px 0 var(--danger); color: var(--fg); }
  .opt.is-wrong .key { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
  .opt:disabled { cursor: default; }
  .feedback { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-lg); margin-bottom: 12px; font-weight: 600; }
  .feedback .icon { width: 26px; height: 26px; stroke-width: 2.4; }
  .feedback small { display: block; font-weight: 400; font-size: 14.5px; }
  .fb-ok { background: var(--success-soft); color: var(--success); }
  .fb-no { background: var(--danger-soft); color: var(--danger); }
  .done { text-align: center; padding-top: 24px; }
  .done-badge { width: 104px; height: 104px; margin: 0 auto 24px; border-radius: 34px; display: grid; place-items: center; background: var(--sun); color: var(--fg); box-shadow: 0 6px 0 var(--sun-shade); }
  .done-badge .icon { width: 52px; height: 52px; stroke-width: 1.8; }
  .done-list { text-align: left; margin-top: 28px; display: grid; gap: 10px; }
  .done-item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); }
  .done-item .en { font-weight: 500; font-size: 16px; line-height: 1.4; }
  .done-item .icon { color: var(--success); stroke-width: 2.4; }
  .done-item > div { flex: 1; min-width: 0; }
  .focus-actions .row { gap: 12px; }
  .focus-actions .btn-primary { flex: 1; }
</style>
</head>
<body>
<script src="assets/icons.js"></script>
<header class="focusbar" data-od-id="practice-progress-bar">
  <div class="session" style="flex:none">
    <div class="focusbar-inner">
      <a class="icon-btn" href="practice-select.html" aria-label="ออกจากรอบฝึก" data-od-id="practice-exit"><svg class="icon"><use href="#i-close"/></svg></a>
      <div class="segments" id="segments" aria-hidden="true"></div>
      <span class="counter" id="counter">1 / 3</span>
    </div>
  </div>
</header>

<main class="session" id="app" aria-live="polite"></main>

<script>
  /* Sample content for layout only — real sentences, images and audio come from the API / Cloudflare R2. */
  const SESSION = { category: 'ชีวิตประจำวัน', tint: 'daily', sentences: [
    { tag: 'new', en: 'Can I get an iced latte, please?', th: 'ขอลาเต้เย็นหนึ่งแก้วได้ไหม',
      img: 'ภาพประกอบ: สั่งกาแฟที่เคาน์เตอร์ร้าน',
      q: 'ประโยคนี้ใช้ในสถานการณ์ไหน?', opts: ['สั่งเครื่องดื่มที่ร้านกาแฟ', 'ถามทางไปสถานีรถไฟ', 'นัดเพื่อนไปดูหนัง', 'ขอยืมหนังสือจากห้องสมุด'], ans: 0 },
    { tag: 'new', en: "I'm running a little late.", th: 'ฉันจะไปสายนิดหน่อยนะ',
      img: 'ภาพประกอบ: รีบเดินพร้อมดูนาฬิกา',
      q: 'คำว่า “running late” หมายถึงอะไร?', opts: ['วิ่งออกกำลังกาย', 'มาถึงช้ากว่าที่นัด', 'ตื่นนอนเช้า', 'กลับบ้านเร็ว'], ans: 1 },
    { tag: 'review', en: 'Could you say that again?', th: 'ช่วยพูดอีกครั้งได้ไหม',
      img: 'ภาพประกอบ: คนสองคนกำลังคุยกัน',
      q: 'ถ้าฟังเพื่อนไม่ทัน ควรพูดประโยคไหน?', opts: ['See you later!', 'Could you say that again?', 'Nice to meet you.', 'I agree with you.'], ans: 1 }
  ]};
  const S = SESSION.sentences, app = document.getElementById('app');
  let i = 0, step = 'show', played = false, picked = null, checked = false;
  const results = [];
  const ico = n => `<svg class="icon"><use href="#i-${n}"/></svg>`;
  const tagBadge = t => t === 'new' ? `<span class="badge badge-new">${ico('sparkle')}ประโยคใหม่</span>` : `<span class="badge badge-review">${ico('repeat')}ทบทวน</span>`;
  const img = (s, label = true) => `<div class="ph-img tint-${SESSION.tint} sentence-img" role="img" aria-label="${s.img}">${ico('image')}${label ? `<span>${s.img}</span>` : ''}</div>`;

  function progress() {
    document.getElementById('segments').innerHTML = S.map((_, k) => `<span class="${k < i || step === 'done' ? 'done' : k === i ? 'current' : ''}"></span>`).join('');
    document.getElementById('counter').textContent = step === 'done' ? 'ครบแล้ว' : `${i + 1} / ${S.length}`;
  }
  function render() {
    const s = S[i]; progress();
    let html = '';
    if (step === 'show') html = `
      <section class="stage pop" data-od-id="practice-step-read">
        <div class="stage-head">${tagBadge(s.tag)}<span class="badge">${SESSION.category}</span></div>
        ${img(s)}
        <p class="sentence-en" lang="en">${s.en}</p>
        <p class="sentence-th">${s.th}</p>
      </section>
      <div class="focus-actions"><button class="btn btn-primary btn-block" data-act="next" data-od-id="practice-next">ถัดไป · ฟังเสียง${ico('arrow-right')}</button></div>`;
    if (step === 'listen') html = `
      <section class="stage listen pop" data-od-id="practice-step-listen">
        <div class="stage-head">${tagBadge(s.tag)}</div>
        ${img(s, false)}
        <button class="speaker" data-act="play" aria-label="เล่นเสียงประโยค" data-od-id="practice-speaker">${ico('speaker')}</button>
        <p class="listen-hint" id="hint">${played ? 'ฟังซ้ำได้ตามต้องการ แล้วลองพูดตามดังๆ' : 'แตะลำโพงเพื่อฟัง แล้วพูดตาม'}</p>
      </section>
      <div class="focus-actions"><div class="row">
        <button class="btn btn-secondary" data-act="back" aria-label="ย้อนกลับไปดูประโยค">${ico('arrow-left')}</button>
        <button class="btn btn-primary" data-act="next" data-od-id="practice-to-quiz">ไปทำ Quiz${ico('arrow-right')}</button>
      </div></div>`;
    if (step === 'quiz') html = `
      <section class="stage pop" data-od-id="practice-step-quiz">
        <div class="stage-head"><span class="badge badge-sun">Quiz</span></div>
        <div class="quiz-ref">${img(s, false)}<p class="en" lang="en" style="font-weight:500">${s.en}</p></div>
        <h2 class="quiz-q">${s.q}</h2>
        <div class="options" role="radiogroup" aria-label="ตัวเลือก">
          ${s.opts.map((o, k) => {
            let cls = '';
            if (checked && k === s.ans) cls = 'is-correct';
            else if (checked && k === picked) cls = 'is-wrong';
            return `<button class="opt ${cls}" role="radio" aria-checked="${k === picked}" data-opt="${k}" ${checked ? 'disabled' : ''} data-od-id="quiz-option-${k + 1}"><span class="key">${'ABCD'[k]}</span><span>${o}</span></button>`;
          }).join('')}
        </div>
      </section>
      <div class="focus-actions">
        ${checked ? (picked === s.ans
          ? `<div class="feedback fb-ok pop" role="status">${ico('check')}<div>ถูกต้อง!<small>เก่งมาก ไปประโยคต่อไปกัน</small></div></div>`
          : `<div class="feedback fb-no pop" role="status">${ico('x')}<div>ยังไม่ใช่<small>คำตอบคือ “${s.opts[s.ans]}”</small></div></div>`) : ''}
        <button class="btn btn-primary btn-block" data-act="${checked ? 'continue' : 'check'}" ${picked === null ? 'disabled' : ''} data-od-id="quiz-submit">
          ${checked ? (i < S.length - 1 ? 'ประโยคถัดไป' : 'จบรอบฝึก') + ico('arrow-right') : 'ตรวจคำตอบ'}
        </button>
      </div>`;
    if (step === 'done') html = `
      <section class="stage done pop" data-od-id="practice-complete">
        <div class="done-badge">${ico('trophy')}</div>
        <h1>ฝึกครบ ${S.length} ประโยคแล้ว!</h1>
        <p class="muted" style="margin-top:8px">ตอบ Quiz ถูก ${results.filter(Boolean).length} จาก ${S.length} ข้อ · ประโยคเหล่านี้จะถูกนำมาทบทวนในรอบถัดไป</p>
        <div class="done-list">${S.map((x, k) => `<div class="done-item">${ico(results[k] ? 'check' : 'repeat')}<div><p class="en" lang="en">${x.en}</p><p class="small muted">${x.th}</p></div>${tagBadge(x.tag)}</div>`).join('')}</div>
      </section>
      <div class="focus-actions"><div class="row">
        <a class="btn btn-secondary" href="game-lobby.html" data-od-id="done-to-game">เล่นมินิเกม</a>
        <a class="btn btn-primary" href="practice-select.html" data-od-id="done-again">ฝึกอีกรอบ</a>
      </div></div>`;
    app.innerHTML = html;
    const first = app.querySelector('.focus-actions .btn-primary:not(:disabled)');
    if (first && step !== 'quiz') first.focus({ preventScroll: true });
  }
  app.addEventListener('click', e => {
    const opt = e.target.closest('[data-opt]');
    if (opt && !checked) { picked = +opt.dataset.opt; return render(); }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'next') { step = step === 'show' ? 'listen' : 'quiz'; }
    if (a === 'back') { step = 'show'; }
    if (a === 'play') {
      b.classList.add('playing'); document.getElementById('hint').textContent = 'กำลังเล่นเสียง…';
      setTimeout(() => { played = true; b.classList.remove('playing'); document.getElementById('hint').textContent = 'ฟังซ้ำได้ตามต้องการ แล้วลองพูดตามดังๆ'; }, 1800);
      return;
    }
    if (a === 'check') { checked = true; results[i] = picked === S[i].ans; }
    if (a === 'continue') {
      if (i < S.length - 1) { i++; step = 'show'; } else step = 'done';
      picked = null; checked = false; played = false;
      window.scrollTo(0, 0);
    }
    render();
  });
  render();
</script>
</body>
</html>
